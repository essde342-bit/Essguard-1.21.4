name: Build EssGuard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: EssGuard-1.21.4
          path: target/EssGuard-1.21.4.jar
